<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BODY BIZ — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0c0c0f;--card:#17171f;--border:#22222e;
    --pink:#e91e8c;--white:#f0f0f5;--sub:#888899;--red:#ff3d57;
  }
  body{
    background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:36px 32px;width:100%;max-width:360px;
  }
  .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;text-align:center;margin-bottom:4px}
  .logo em{color:var(--pink);font-style:normal}
  .tagline{font-size:12px;color:var(--sub);text-align:center;margin-bottom:28px}
  label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--sub);display:block;margin-bottom:8px}
  input{
    width:100%;background:#0c0c0f;border:1px solid var(--border);border-radius:6px;
    padding:12px 14px;color:var(--white);font-size:15px;letter-spacing:2px;text-align:center;
    outline:none;transition:border-color .15s;
  }
  input:focus{border-color:var(--pink)}
  button{
    width:100%;margin-top:16px;background:var(--pink);color:#fff;border:none;
    border-radius:6px;padding:12px;font-size:13px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;cursor:pointer;transition:opacity .15s;
  }
  button:hover{opacity:.9}
  button:disabled{opacity:.5;cursor:default}
  .error{color:var(--red);font-size:12px;margin-top:12px;text-align:center;min-height:16px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">BODY <em>BIZ</em></div>
    <div class="tagline">Enter your access code</div>
    <form id="loginForm">
      <label for="password">Access Code</label>
      <input id="password" type="password" autocomplete="off" autofocus placeholder="••••••••">
      <button type="submit" id="submitBtn">Enter</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errorMsg');
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next') || '/';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Checking…';
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = next;
        } else {
          err.textContent = data.error === 'Invalid code' ? 'Invalid code. Try again.' : 'Something went wrong.';
        }
      } catch {
        err.textContent = 'Network error. Try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enter';
      }
    });
  </script>
</body>
</html>
